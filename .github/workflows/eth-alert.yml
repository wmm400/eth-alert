name: ETH 4H Alert

on:
  # 定时交给 cron-job.org，GitHub 自带 schedule 会延迟 1-3 小时并漏跑
  # schedule:
  #   - cron: "5 0,4,8,12,16,20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: eth-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check signal and push
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: node cloud/alert.js

      - name: Persist state
        run: |
          git config user.name "eth-alert-bot"
          git config user.email "eth-alert-bot@users.noreply.github.com"
          git add cloud/state.json
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "chore: update alert state"
            git push
          fi
